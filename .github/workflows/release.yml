name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Release Archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Source archive (all files except .git)
          tar -czf "fast-download-${VERSION}.tar.gz" \
            --exclude=.git \
            --exclude='.github/workflows/*' \
            --exclude='packaging/*' \
            --exclude='scripts/create-demo.sh' \
            .
          
          # Minimal archive (just the essentials for shell users)
          mkdir -p minimal
          cp src/fast-download.sh minimal/
          cp README.md minimal/
          cp LICENSE minimal/
          tar -czf "fast-download-${VERSION}-minimal.tar.gz" minimal/
          
          # Windows archive (with PowerShell module)
          mkdir -p windows
          cp -r opencode windows/
          cp -r vscode windows/
          cp scripts/install.ps1 windows/
          cp scripts/uninstall.ps1 windows/
          cp README.md windows/
          cp LICENSE windows/
          # Convert line endings for Windows
          find windows -name "*.md" -o -name "*.ps1" -o -name "*.json" -o -name "*.psm1" | xargs -r unix2dos 2>/dev/null || true
          zip -r "fast-download-${VERSION}-windows.zip" windows/

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "fast-download ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            fast-download-*.tar.gz
            fast-download-*.zip
          body: |
            ## fast-download ${{ steps.version.outputs.version }}
            
            Universal download accelerator for AI coding agents.
            
            ### Installation
            
            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/AbdullahAlHadi/fast-download/main/scripts/install.ps1 | iex
            ```
            
            **Linux/macOS/WSL (Bash):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/AbdullahAlHadi/fast-download/main/scripts/install.sh | bash
            ```
            
            ### What's Included
            - `src/fast-download.sh` — Universal shell library
            - `opencode/FastDownload.psm1` — PowerShell module
            - Agent configs for OpenCode, Claude Code, Codex, Continue, Cline, VS Code, Cursor, Windsurf, JetBrains AI, Amazon Q, Warp
            - Installers and uninstallers
            
            ### Supported Agents
            See [README](https://github.com/AbdullahAlHadi/fast-download#supported-agents) for full list.

  test-release:
    name: Test Release Artifacts
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: fast-download-*
          merge-multiple: true
      
      - name: Test shell library
        if: runner.os != 'Windows'
        run: |
          tar -xzf fast-download-*.tar.gz
          bash -n src/fast-download.sh
          source src/fast-download.sh
          declare -f fd_download fd_git_clone fd_verify fd_speed_test fd_init

      - name: Test PowerShell module
        if: runner.os == 'Windows'
        run: |
          Expand-Archive fast-download-*-windows.zip
          cd windows
          Import-Module ./opencode/FastDownload.psm1 -Force
          Initialize-FastDownload

      - name: Test install script syntax
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -Command "Set-StrictMode -Version Latest; . ./scripts/install.ps1 -Force -SkipAria2 -SkipGitConfig -SkipNpmConfig -SkipPipConfig -OnlyAgent opencode -WhatIf"
          else
            bash -n ./scripts/install.sh
            DRY_RUN=1 bash ./scripts/install.sh --agent opencode
          fi