name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install aria2 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Install aria2 (macOS)
        if: runner.os == 'macOS'
        run: brew install aria2

      - name: Install aria2 (Windows)
        if: runner.os == 'Windows'
        run: choco install aria2 -y

      - name: Run Bash test suite
        if: runner.os != 'Windows'
        run: bash scripts/test.sh

      - name: Test PowerShell module (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module ./opencode/FastDownload.psm1
          Get-Command Invoke-FastDownload
          Get-Command Invoke-GitClone
          Get-Command Test-FileChecksum

      - name: Test Shell Script Syntax (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          bash -n ./src/fast-download.sh
          bash -n ./scripts/install.sh
          bash -n ./scripts/uninstall.sh
          DRY_RUN=true bash ./scripts/install.sh opencode

      - name: Test PowerShell Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/install.ps1 -Agent opencode -SkipAria2 -SkipGitConfig -SkipNpmConfig -SkipPipConfig -DryRun

      - name: Test Node installer
        run: |
          node --check scripts/install.js
          node --check scripts/fast-download.js
          node --check vscode/fast-download/extension.js
          node scripts/install.js --agent=opencode --dry-run

      - name: Test agent config files exist
        run: |
          node -e "
            const fs = require('fs');
            const files = [
              'opencode/SKILL.md',
              'claude-code/fast-download.md',
              'codex/fast-download.md',
              'continue/fast-download.yaml',
              'cline/fast-download/instructions.md',
              'vscode/fast-download/package.json',
              'vscode/fast-download/extension.js',
              'cursor/fast-download/instructions.md',
              'windsurf/fast-download/instructions.md',
              'jetbrains/fast-download.md',
              'amazon-q/fast-download.md',
              'warp/fast-download.yaml'
            ];
            for (const f of files) {
              if (!fs.existsSync(f)) {
                console.error('Missing required file: ' + f);
                process.exit(1);
              }
            }
            console.log('All agent configs present');
          "
